  <!-- ==================== MAIN HOME VIEW CONTAINER ==================== -->
  <div id="homeView" class="relative min-h-screen w-full max-w-md mx-auto flex flex-col justify-between px-5 pt-6 pb-6 bg-gradient-to-b from-slate-900/60 via-slate-950/80 to-slate-950 border-x border-cyan-500/10 shadow-2xl">
    
    <!-- BACKGROUND GLOW ACCENTS -->
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 -right-20 w-60 h-60 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="z-10">
      <!-- ==================== HEADER ==================== -->
      <header class="flex items-center justify-between py-2 mb-6">
        <!-- Logo -->
        <div class="flex items-center space-x-2.5 group cursor-pointer" onclick="showToast('Pulse Horizon OS v2.5 Active')">
          <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-600 p-[2px] glow-cyan">
            <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center">
              <div class="w-3 h-3 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full animate-pulse"></div>
            </div>
          </div>
          <span class="text-base font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-cyan-100 to-blue-400">
            PULSE HORIZON
          </span>
        </div>

        <!-- Header Actions (Tabs + Profile) -->
        <div class="flex items-center space-x-3">
          <!-- Tab Switcher Button with badge -->
          <button id="tabButton" onclick="openTabSwitcher()" class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-slate-900/90 border border-cyan-500/40 text-cyan-300 glow-cyan-sm hover:bg-slate-800 hover:border-cyan-400 transition-all active:scale-95">
            <span id="tabCountBadge" class="text-xs font-bold font-mono">3</span>
            <div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-cyan-400 rounded-full animate-ping opacity-75"></div>
          </button>

          <button onclick="if (window.AndroidHome && AndroidHome.openAccountChooser) { AndroidHome.openAccountChooser(); } else { window.location.href='https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fmyaccount.google.com%2F'; }" class="flex items-center justify-center w-9 h-9 rounded-full bg-slate-900/90 border border-cyan-500/30 text-cyan-400 hover:border-cyan-400 transition-all hover:glow-cyan-sm active:scale-95">
            <i data-lucide="user" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- ==================== SEARCH BAR ==================== -->
      <section class="relative mb-3 z-30">

          <input

            id="searchInput"

      <!-- ==================== SHORTCUTS SECTION ==================== -->

            <span class="text-xs font-semibold text-cyan-300/80 uppercase tracking-wider">Shortcuts</span>
            <button 
              type="button"

              Edit

          <button

            onclick="toggleShortcutsExpand()"

            class="flex items-center space-x-1 text-xs text-cyan-400 hover:text-cyan-200 transition-colors px-2.5 py-1 rounded-lg bg-slate-900/60 border border-cyan-500/20 active:scale-95"
          >
            <span id="shortcutsExpandText" class="text-[11px] font-semibold">More (6)</span>
            <i data-lucide="chevron-down" id="shortcutsExpandIcon" class="w-3.5 h-3.5 transition-transform duration-300"></i>

        <!-- Shortcuts Grid / Container -->

    <!-- ==================== FOOTER ==================== -->

  <!-- ==================== TAB SWITCHER VIEW (CHROME STYLE) ==================== -->
  <div id="tabSwitcherView" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col justify-between px-5 pt-6 pb-6">
    <!-- Tab Switcher Header -->

    <!-- Tab Cards Grid Area -->

  <!-- ==================== SHORTCUT ADD / EDIT MODAL ==================== -->
  <div id="shortcutModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">

        <h3 id="shortcutModalTitle" class="text-sm font-bold text-slate-100">Add Shortcut</h3>
        <button onclick="closeShortcutModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

      <form onsubmit="handleSaveShortcutSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-medium text-cyan-300 mb-1">Shortcut Name</label>

            type="button" 
            onclick="closeShortcutModal()"

          >
            Cancel
          </button>
          <button 
            type="submit" 
            class="px-4 py-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl text-xs font-semibold shadow-lg hover:brightness-110 active:scale-95"

  <!-- ==================== NOTIFICATION TOAST ==================== -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 border border-cyan-400/50 text-cyan-200 text-xs px-4 py-2.5 rounded-xl shadow-xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2.5">
    <i data-lucide="info" id="toastIcon" class="w-4 h-4 text-cyan-400"></i>
    <span id="toastMessage">Notification message</span>
    <button id="toastActionBtn" class="hidden ml-2 px-2 py-0.5 bg-cyan-500 text-slate-950 font-bold rounded-lg hover:bg-cyan-400 transition-all"></button>
  </div>


  <!-- ==================== JAVASCRIPT APPLICATION CORE ==================== -->
  <script>
    // --- Search Engines Configuration (NO Startpage) ---
    const enginesList = [
      { id: 'google', name: 'Google', icon: 'search', url: 'https://www.google.com/search?q=' },
      { id: 'bing', name: 'Bing', icon: 'globe', url: 'https://www.bing.com/search?q=' },
      { id: 'duckduckgo', name: 'DuckDuckGo', icon: 'lock', url: 'https://duckduckgo.com/?q=' },
      { id: 'wikipedia', name: 'Wikipedia', icon: 'book-open', url: 'https://en.wikipedia.org/wiki/Special:Search?search=' }
    ];

    let savedEngineId = localStorage.getItem('pulse_engine') || 'google';
    let currentEngine = enginesList.find(e => e.id === savedEngineId) || enginesList[0];

    // --- Default Shortcuts List ---
    const defaultShortcuts = [
      { id: 'sc-1', name: 'Google', iconSvg: '<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>', url: 'https://google.com' },
      { id: 'sc-2', name: 'Maps', iconSvg: '<path fill="#EA4335" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>', url: 'https://maps.google.com' },
      { id: 'sc-3', name: 'Meet', iconSvg: '<rect x="3" y="5" width="12" height="14" rx="3" fill="#00832D"/><path fill="#00A859" d="M15 8.5l5-3.5v12l-5-3.5v-5z"/><path fill="#FFBA00" d="M3 8a3 3 0 0 1 3-3h9v4H3V8z"/>', url: 'https://meet.google.com' },
      { id: 'sc-4', name: 'Photos', iconSvg: '<path fill="#EA4335" d="M12 4a4 4 0 0 0-4 4h4V4z"/><path fill="#4285F4" d="M20 12a4 4 0 0 0-4-4v4h4z"/><path fill="#34A853" d="M12 20a4 4 0 0 0 4-4h-4v4z"/><path fill="#FBBC05" d="M4 12a4 4 0 0 0 4 4v-4H4z"/>', url: 'https://photos.google.com' },
      { id: 'sc-5', name: 'Gmail', iconSvg: '<path fill="#EA4335" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>', url: 'https://mail.google.com' },
      { id: 'sc-6', name: 'Calendar', iconSvg: '<rect x="3" y="4" width="18" height="18" rx="3" fill="#4285F4"/><path fill="#FFF" d="M7 2v4M17 2v4M3 9h18"/><text x="12" y="18" font-size="8" font-weight="bold" fill="#FFF" text-anchor="middle">31</text>', url: 'https://calendar.google.com' },
      { id: 'sc-7', name: 'YouTube', iconSvg: '<path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.9 31.9 0 0 0 0 12a31.9 31.9 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1 31.9 31.9 0 0 0 .5-5.8 31.9 31.9 0 0 0-.5-5.8z"/><polygon fill="#FFF" points="9.6,15.5 15.8,12 9.6,8.5"/>', url: 'https://youtube.com' },
      { id: 'sc-8', name: 'Drive', iconSvg: '<path fill="#FFC107" d="M7.7 3h8.6l5.7 10H13.4z"/><path fill="#1976D2" d="M13.4 13l-5.7 10H2l5.7-10z"/><path fill="#4CAF50" d="M13.4 13H22l-5.7 10H7.7z"/>', url: 'https://drive.google.com' },
      { id: 'sc-9', name: 'Google apps', iconSvg: '<circle cx="6" cy="6" r="2" fill="#4285F4"/><circle cx="12" cy="6" r="2" fill="#EA4335"/><circle cx="18" cy="6" r="2" fill="#FBBC05"/><circle cx="6" cy="12" r="2" fill="#34A853"/><circle cx="12" cy="12" r="2" fill="#4285F4"/><circle cx="18" cy="12" r="2" fill="#EA4335"/><circle cx="6" cy="18" r="2" fill="#FBBC05"/><circle cx="12" cy="18" r="2" fill="#34A853"/><circle cx="18" cy="18" r="2" fill="#4285F4"/>', url: 'https://about.google/products/' }
    ];

    let shortcuts = JSON.parse(localStorage.getItem('pulse_shortcuts_v2')) || defaultShortcuts;

    // --- Open Tabs State ---
    // The home page is NOT a tab - it is where you start from. The browser
    // fills this list with its real tabs (phSetTabs), so the screen and the
    // number always agree with the browser.
    let openTabs = [];
    let lastClosedTab = null;
    let undoTimer = null;

    // --- State flags ---
    let isShortcutsExpanded = false;
    let isManageShortcutsMode = false;
    let editingShortcutId = null;
    let attachedFiles = [];
    let recognition = null;

    // Initialize application on load
    window.onload = function() {
      updateEngineUI();
      renderEngineDropdownOptions();
      renderShortcuts();
      updateTabCountBadges();
      lucide.createIcons();
    };

    // ==================== SEARCH ENGINE LOGIC ====================
    function updateEngineUI() {
      document.getElementById('currentEngineName').innerText = currentEngine.name;
      document.getElementById('currentEngineIcon').setAttribute('data-lucide', currentEngine.icon);
      lucide.createIcons();
    }

    function closeEngineDropdown() {
      const d = document.getElementById('engineDropdown');
      const a = document.getElementById('engineArrow');
      if (d) d.classList.add('hidden');
      if (a) a.style.transform = 'rotate(0deg)';
    }

    function toggleEngineDropdown() {
      const dropdown = document.getElementById('engineDropdown');
      const arrow = document.getElementById('engineArrow');
      dropdown.classList.toggle('hidden');
      arrow.style.transform = dropdown.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
    }

    function renderEngineDropdownOptions() {
      const container = document.getElementById('engineOptionsContainer');
      container.innerHTML = '';

      enginesList.forEach(engine => {
        const isSelected = engine.id === currentEngine.id;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs transition-all ${isSelected ? 'bg-cyan-500/20 text-cyan-200 font-bold border border-cyan-500/40' : 'text-slate-300 hover:bg-slate-800'}`;
        btn.onclick = () => selectEngine(engine.id);

        btn.innerHTML = `
          <div class="flex items-center space-x-2">
            <i data-lucide="${engine.icon}" class="w-3.5 h-3.5 text-cyan-400"></i>
            <span>${engine.name}</span>
          </div>
          ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-cyan-400"></i>' : ''}
        `;
        container.appendChild(btn);
      });
      lucide.createIcons();
    }

    function selectEngine(id) {
      const found = enginesList.find(e => e.id === id);
      if (found) {
        currentEngine = found;
        localStorage.setItem('pulse_engine', found.id);
        updateEngineUI();
        renderEngineDropdownOptions();
        closeEngineDropdown();
        showToast(`Search Engine set to ${found.name}`);
      }
    }

    // ==================== SHORTCUTS LOGIC (CRITICAL FIX) ====================
    function toggleShortcutsExpand() {
      isShortcutsExpanded = !isShortcutsExpanded;
      renderShortcuts();
    }

    function toggleManageShortcuts() {
      isManageShortcutsMode = !isManageShortcutsMode;
      const btn = document.getElementById('manageShortcutsBtn');
      if (btn) {
        btn.innerText = isManageShortcutsMode ? 'Done' : 'Edit';
        btn.className = isManageShortcutsMode 
          ? 'text-[10px] px-2 py-0.5 rounded-md bg-cyan-500 border border-cyan-300 text-slate-950 font-bold transition-all active:scale-95'
          : 'text-[10px] px-2 py-0.5 rounded-md bg-slate-900 border border-cyan-500/30 text-cyan-400 hover:text-cyan-200 transition-all active:scale-95';
      }
      renderShortcuts();
    }

    function renderShortcuts() {
      const container = document.getElementById('shortcutsContainer');
      const expandText = document.getElementById('shortcutsExpandText');
      const expandIcon = document.getElementById('shortcutsExpandIcon');
      const footerCount = document.getElementById('shortcutCountFooter');

      container.innerHTML = '';

      // Collapsed state shows EXACTLY 3 shortcut icons, Expanded shows all
      const visibleShortcuts = isShortcutsExpanded ? shortcuts : shortcuts.slice(0, 3);
      const remainingCount = Math.max(0, shortcuts.length - 3);

      if (expandText) {
        expandText.innerText = isShortcutsExpanded ? 'Less ▲' : `More (${remainingCount}) ▾`;
      }

      visibleShortcuts.forEach(item => {
        const tile = document.createElement('div');
        tile.className = 'relative flex flex-col items-center justify-center p-3.5 bg-slate-900/60 border border-cyan-500/20 rounded-2xl cursor-pointer hover:border-cyan-400/60 hover:bg-slate-800/85 transition-all hover:scale-105 active:scale-95 group glow-cyan-sm';

        if (isManageShortcutsMode) {
          tile.onclick = (e) => e.stopPropagation();
          tile.innerHTML = `
            <div class="absolute -top-2 -right-2 flex space-x-1 z-20">
              <button onclick="openEditShortcutModal('${item.id}', event)" class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg hover:bg-blue-500">
                <i data-lucide="pencil" class="w-3 h-3"></i>
              </button>
              <button onclick="deleteShortcut('${item.id}', event)" class="w-6 h-6 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg hover:bg-red-500">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
              </button>
            </div>
          `;
        } else {
          tile.onclick = () => { if (item.url) window.location.href = item.url; };
        }

        let iconMarkup = '';
        if (item.faviconUrl) {
          iconMarkup = `<img src="${item.faviconUrl}" data-rest="${(item.iconRest||[]).join('|')}" class="w-8 h-8 rounded-md object-contain" onerror="phIconErr(this)"/>`;
        } else if (item.iconSvg) {
          iconMarkup = `<svg class="w-8 h-8 filter drop-shadow-md group-hover:scale-110 transition-transform" viewBox="0 0 24 24">${item.iconSvg}</svg>`;
        } else {
          iconMarkup = `<div class="w-8 h-8 rounded-lg bg-cyan-900/50 border border-cyan-400/40 flex items-center justify-center text-cyan-300 font-bold">${item.name.charAt(0).toUpperCase()}</div>`;
        }

        tile.innerHTML += `
          <div class="w-10 h-10 mb-1.5 flex items-center justify-center">
            ${iconMarkup}
          </div>
          <span class="text-[11px] font-medium text-slate-300 group-hover:text-cyan-200 truncate w-full text-center">
            ${item.name}
          </span>
        `;
        container.appendChild(tile);
      });

      // Show "+ Add" tile in expanded or manage mode
      if (isShortcutsExpanded || isManageShortcutsMode) {
        const addTile = document.createElement('div');
        addTile.className = 'flex flex-col items-center justify-center p-3.5 bg-slate-900/30 border border-dashed border-cyan-500/30 rounded-2xl cursor-pointer hover:border-cyan-400 hover:bg-slate-900/60 transition-all active:scale-95 group';
        addTile.onclick = openAddShortcutModal;
        addTile.innerHTML = `
          <div class="w-10 h-10 mb-1.5 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition-transform">
            <i data-lucide="plus" class="w-6 h-6"></i>
          </div>
          <span class="text-[11px] font-medium text-cyan-400/80 group-hover:text-cyan-300">Add</span>
        `;
        container.appendChild(addTile);
      }

      if (footerCount) {
        footerCount.innerText = `icons ${visibleShortcuts.length}/${shortcuts.length}`;
      }
      lucide.createIcons();
    }

    // Modal Shortcut CRUD
    function openAddShortcutModal() {
      editingShortcutId = null;
      document.getElementById('shortcutModalTitle').innerText = "Add Shortcut";
      document.getElementById('shortcutNameInput').value = "";
      document.getElementById('shortcutUrlInput').value = "";
      document.getElementById('shortcutModal').classList.remove('opacity-0', 'pointer-events-none');
    }

    function openEditShortcutModal(id, event) {
      if (event) event.stopPropagation();
      const item = shortcuts.find(s => s.id === id);
      if (!item) return;

      editingShortcutId = id;
      document.getElementById('shortcutModalTitle').innerText = "Edit Shortcut";
      document.getElementById('shortcutNameInput').value = item.name;
      document.getElementById('shortcutUrlInput').value = item.url;
      document.getElementById('shortcutModal').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeShortcutModal() {
      document.getElementById('shortcutModal').classList.add('opacity-0', 'pointer-events-none');
    }

    function handleSaveShortcutSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('shortcutNameInput').value.trim();
      let url = document.getElementById('shortcutUrlInput').value.trim();

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      try {
        const domain = new URL(url).hostname;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        if (editingShortcutId) {
          const index = shortcuts.findIndex(s => s.id === editingShortcutId);
          if (index !== -1) {
            shortcuts[index].name = name;
            shortcuts[index].url = url;
            shortcuts[index].faviconUrl = faviconUrl;
            delete shortcuts[index].iconSvg;
          }
          showToast(`Updated "${name}"`);
        } else {
          shortcuts.push({
            id: 'sc-' + Date.now(),
            name: name,
            url: url,
            faviconUrl: faviconUrl
          });
          showToast(`Added "${name}"`);
        }

        localStorage.setItem('pulse_shortcuts_v2', JSON.stringify(shortcuts));
        closeShortcutModal();
        renderShortcuts();
      } catch (err) {
        showToast("Invalid URL format");
      }
    }

    function deleteShortcut(id, event) {
      if (event) event.stopPropagation();
      shortcuts = shortcuts.filter(s => s.id !== id);
      localStorage.setItem('pulse_shortcuts_v2', JSON.stringify(shortcuts));
      renderShortcuts();
      showToast("Shortcut removed");
    }

    // ==================== FILE & MULTIMODAL AI UPLOAD ==================== -->
    function triggerFileInput() {
      document.getElementById('fileInput').click();
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileObj = {
        name: file.name,
        size: (file.size / (1024*1024)).toFixed(1) + ' MB',
        type: file.type.includes('image') ? 'image' : file.type.includes('video') ? 'video' : 'file',
        url: URL.createObjectURL(file)
      };

      attachedFiles.push(fileObj);
      renderAttachedFiles();
      showToast(`Attached ${file.name} for Search AI`);
      event.target.value = '';
    }

    function renderAttachedFiles() {
      const container = document.getElementById('attachedFilesContainer');
      if (attachedFiles.length === 0) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }

      container.classList.remove('hidden');
      container.innerHTML = '';

      attachedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'flex items-center space-x-2 bg-slate-950 border border-cyan-500/40 px-2.5 py-1.5 rounded-xl text-xs text-cyan-200';
        chip.innerHTML = `
          <i data-lucide="${file.type === 'image' ? 'image' : file.type === 'video' ? 'video' : 'file-text'}" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span class="max-w-[120px] truncate">${file.name}</span>
          <button type="button" onclick="removeAttachedFile(${index})" class="text-slate-400 hover:text-red-400">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        `;
        container.appendChild(chip);
      });
      lucide.createIcons();
    }

    function removeAttachedFile(index) {
      attachedFiles.splice(index, 1);
      renderAttachedFiles();
    }

    // ==================== VOICE SEARCH (WEB SPEECH API) ==================== -->
    function toggleVoiceSearch() {
      const micBtn = document.getElementById('micBtn');
      const searchInput = document.getElementById('searchInput');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showToast("Voice search not supported in this browser.");
        return;
      }

      if (recognition && isListening) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('mic-listening');
        showToast("Listening... Speak now");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        searchInput.value = transcript;
        showToast(`Heard: "${transcript}"`);
        setTimeout(() => handleSearchSubmit(), 600);
      };

      recognition.onerror = () => {
        stopVoiceAnimation();
        showToast("Voice recognition error.");
      };

      recognition.onend = () => {
        stopVoiceAnimation();
      };

      recognition.start();
    }

    function stopVoiceAnimation() {
      isListening = false;
      const micBtn = document.getElementById('micBtn');
      if (micBtn) micBtn.classList.remove('mic-listening');
    }

    // ==================== SEARCH SUBMISSION ==================== -->
    function handleSearchSubmit(e) {
      if (e) e.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query && attachedFiles.length === 0) {
        showToast("Enter a query or attach a file.");
        return;
      }

      let fullQuery = query;
      if (attachedFiles.length > 0) {
        const fileNames = attachedFiles.map(f => f.name).join(', ');
        fullQuery = (query ? query + ' ' : '') + '[Attached: ' + fileNames + ' - Multimodal query]';
        showToast("AI Analyzing attached media & query...");
        setTimeout(() => {
          window.location.href = currentEngine.url + encodeURIComponent(fullQuery);
          attachedFiles = [];
          renderAttachedFiles();
        }, 1000);
      } else {
        showToast(`Searching ${currentEngine.name}...`);
        window.location.href = currentEngine.url + encodeURIComponent(query);
      }
    }

    // ==================== TAB SWITCHER & TABS MANAGEMENT ==================== -->
    function openTabSwitcher() {
      renderTabCards();
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('tabSwitcherView').classList.remove('hidden');
    }

    function closeTabSwitcher() {
      document.getElementById('tabSwitcherView').classList.add('hidden');
      document.getElementById('homeView').classList.remove('hidden');
    }

    // v138: the browser hands over its real tab list
    function phSetTabs(list) {
      try {
        if (!list || !list.length) return;
        openTabs = list.map(function (t, i) {
          return { id: i, title: t.title || 'New tab', url: t.url || '', active: !!t.active };
        });
        renderTabCards();
      } catch (e) {}
    }

    function updateTabCountBadges() {
      const count = openTabs.length;
      document.getElementById('tabCountBadge').innerText = count;
      const switcherBadge = document.getElementById('switcherTabCount');
      if (switcherBadge) switcherBadge.innerText = count;
    }

    function renderTabCards() {
      const grid = document.getElementById('tabsGridContainer');
      grid.innerHTML = '';

      openTabs.forEach((tab, tabIndex) => {
        const card = document.createElement('div');
        card.className = `relative flex flex-col justify-between p-3.5 bg-slate-900 border ${tab.active ? 'border-cyan-400 glow-cyan-sm' : 'border-cyan-500/30'} rounded-2xl h-40 cursor-pointer hover:border-cyan-400 transition-all group`;
        // v138: these are the browser's real tabs - tapping one switches the
        // browser to it. The browser owns the tabs; this screen only shows them.
        card.onclick = () => {
          if (tab.active) { closeTabSwitcher(); return; }
          window.location.href = 'pulse://tab/' + tabIndex;
        };

        card.innerHTML = `
          <!-- Card Header -->
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5">
              <div class="w-2 h-2 rounded-full ${tab.active ? 'bg-cyan-400 animate-pulse' : 'bg-slate-600'}"></div>
              <span class="text-[11px] font-bold text-slate-300 truncate max-w-[100px]">${tab.title}</span>
            </div>
            <button type="button" onclick="phCloseTab(${tabIndex}, event)" class="w-6 h-6 rounded-lg bg-slate-800 text-slate-400 hover:text-red-400 hover:bg-slate-700 flex items-center justify-center transition-all">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- Card Body Preview Placeholder -->
          <div class="flex-1 my-2 bg-slate-950/80 rounded-xl border border-cyan-500/20 p-2 flex flex-col justify-center items-center text-center">
            <i data-lucide="globe" class="w-6 h-6 text-cyan-500/60 mb-1"></i>
            <span class="text-[10px] text-slate-400 truncate w-full">${tab.url}</span>
          </div>

          <!-- Card Footer -->
          <div class="flex items-center justify-between text-[10px] text-slate-400">
            <span>Pulse Horizon</span>
            <span>${tab.active ? 'Active' : 'Tab'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
      updateTabCountBadges();
      lucide.createIcons();
    }

    function addNewTab() {
      const newTabId = Date.now();
      const newTab = {
        id: newTabId,
        title: `New Tab #${openTabs.length + 1}`,
        url: 'pulse://newtab',
        active: true
      };

      openTabs.forEach(t => t.active = false);
      openTabs.push(newTab);
      renderTabCards();
      showToast("Opened new tab");
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const index = openTabs.findIndex(t => t.id === id);
      if (index === -1) return;

      lastClosedTab = openTabs[index];
      openTabs.splice(index, 1);

      // If we closed the active tab, make another active
      if (lastClosedTab.active && openTabs.length > 0) {
        openTabs[0].active = true;
      }

      renderTabCards();
      showUndoToast();

      if (openTabs.length === 0) {
        addNewTab();
      }
    }

    function closeAllTabs() {
      // v138: ask the browser to close them for real, and keep the message up
      // for ten seconds - not forever.
      showToast("All tabs closed", 10000);
      window.location.href = 'pulse://closeall';
    }

    function phCloseTab(index, event) {
      if (event) event.stopPropagation();
      window.location.href = 'pulse://closetab/' + index;
    }

    // ==================== 5-SECOND UNDO TOAST ==================== -->
    function showUndoToast() {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toastMessage');
      const actionBtn = document.getElementById('toastActionBtn');

      msg.innerText = "Tab closed";
      actionBtn.innerText = "Undo";
      actionBtn.classList.remove('hidden');
      actionBtn.onclick = () => {
        if (lastClosedTab) {
          openTabs.push(lastClosedTab);
          lastClosedTab = null;
          renderTabCards();
          clearTimeout(undoTimer);
          hideToast();
          showToast("Tab restored!");
        }
      };

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      clearTimeout(undoTimer);
      undoTimer = setTimeout(() => {
        hideToast();
        lastClosedTab = null;
      }, 10000);   // v138: ten seconds, as asked
    }

    // v137: the browser calls this so the page matches its Dark/Light setting
    function phSetTheme(isLight) {
      try { document.documentElement.classList.toggle('ph-light', !!isLight); } catch (e) {}
    }

    function showToast(message, ms) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toastMessage');
      const actionBtn = document.getElementById('toastActionBtn');
      const life = (typeof ms === 'number') ? ms : 2500;

      msg.innerText = message;
      actionBtn.classList.add('hidden');

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        if (!lastClosedTab || toast.querySelector('button').classList.contains('hidden')) {
          hideToast();
        }
      }, life);
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }

    // ==================== PULSE HORIZON APP WIRING ====================
    // Real icons + the app hand-off. Nothing here talks to a CDN.
    var ANDROID = (typeof AndroidHome !== 'undefined') ? AndroidHome : null;
    var PH_ICONS = {};

    function phHost(u){ try { return new URL(u).hostname; } catch (e) { return ''; } }
    function phCandidates(u){
      var h = phHost(u); if (!h) return [];
      var out = [];
      if (PH_ICONS[h]) out.push(PH_ICONS[h]);
      out.push('https://www.google.com/s2/favicons?sz=128&domain=' + h);
      out.push('https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://' + h + '&size=128');
      out.push('https://' + h + '/apple-touch-icon.png');
      out.push('https://' + h + '/favicon.ico');
      return out;
    }
    function phIconErr(img){
      var rest = (img.getAttribute('data-rest') || '').split('|').filter(Boolean);
      if (rest.length) { img.setAttribute('data-rest', rest.slice(1).join('|')); img.src = rest[0]; }
    }
    // the app hands icons over; we just take them
    function phSetIcons(m){ PH_ICONS = m || {}; try { applyRealIcons(); } catch (e) {} }
    function phOneIcon(h, uri){ if (h && uri) { PH_ICONS[h] = uri; try { applyRealIcons(); } catch (e) {} } }
    function phDebug(m){ /* the app keeps its own report; nothing to show here */ }

    // the hosts this page is showing - the app asks for these
    function phHosts(){
      var out = [];
      shortcuts.forEach(function(s){ var h = phHost(s.url); if (h && out.indexOf(h) < 0) out.push(h); });
      return JSON.stringify(out);
    }
    function askIcons(){
      try { if (ANDROID && ANDROID.wantIcons) ANDROID.wantIcons(phHosts()); } catch (e) {}
    }
    // give every shortcut its icon chain
    function applyRealIcons(){
      shortcuts.forEach(function(s){
        var list = phCandidates(s.url);
        if (list.length) { s.faviconUrl = list[0]; s.iconRest = list.slice(1); }
      });
      renderShortcuts();
    }
    // keep the app's copy of the shortcuts, so they survive the exit wipe
    function phSaveShortcuts(){
      try { if (ANDROID && ANDROID.setTiles) ANDROID.setTiles(JSON.stringify(shortcuts)); } catch (e) {}
    }
    (function phLoadShortcuts(){
      try {
        if (ANDROID && ANDROID.getTiles) {
          var raw = ANDROID.getTiles();
          if (raw) { var a = JSON.parse(raw); if (a && a.length) shortcuts = a; }
        }
      } catch (e) {}
    })();

    // wrap the renderer: real icons first, then tell the app which hosts we need
    var _phRenderShortcuts = renderShortcuts;
    renderShortcuts = function(){
      applyRealIconsSilent();
      _phRenderShortcuts.apply(this, arguments);
      askIcons();
    };
    function applyRealIconsSilent(){
      shortcuts.forEach(function(s){
        var h = phHost(s.url);
        // 1. an icon the app handed over (the real installed-app icon)
        if (h && PH_ICONS[h]) { s.faviconUrl = PH_ICONS[h]; s.iconRest = []; return; }
        // 2. the design's own drawn brand icon - exact, offline, better than
        //    anything fetched. Keep it.
        if (s.iconSvg) { s.faviconUrl = null; s.iconRest = []; return; }
        // 3. a shortcut you added yourself: use the site's own icon chain
        var list = phCandidates(s.url);
        if (list.length) { s.faviconUrl = list[0]; s.iconRest = list.slice(1); }
      });
    }
    var _phOnload = window.onload;
    window.onload = function(){ if (_phOnload) _phOnload(); askIcons(); };

  </script>
