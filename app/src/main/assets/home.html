<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Horizon</title>
<style>
/* ============================================================
   PULSE HORIZON — HOME PAGE
   Dark / neon design. Colours + glow live in :root below.
   ============================================================ */

:root{
  --bg:        #070a12;
  --tile-1:    #0f1730;
  --tile-2:    #0a1122;
  --line:      rgba(57,208,255,.38);
  --glow:      57,208,255;
  --text:      #eaf6ff;
  --muted:     #7f95b3;
  --accent:    #39d0ff;
  --accent-2:  #8c50ff;

  --radius:    20px;
  --radius-sm: 12px;
  --gap:       14px;
  --maxw:      560px;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#eef3fb; --tile-1:#ffffff; --tile-2:#f3f7ff;
    --line:rgba(30,120,190,.35); --glow:30,120,190;
    --text:#0d1420; --muted:#5b6a80;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 15% -10%, rgba(var(--glow),.12), transparent 60%),
    radial-gradient(120% 80% at 100% 110%, rgba(140,80,255,.12), transparent 55%),
    var(--bg);
  color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px);
  display:flex; justify-content:center;
}
/* faint circuit grid, faded at the edges */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image:
    linear-gradient(rgba(var(--glow),.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--glow),.07) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 76%);
  mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 76%);
}
.wrap{width:100%; max-width:var(--maxw); position:relative; z-index:1}

/* ---------- top bar ---------- */
.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.16em; font-size:12.5px; color:var(--accent)}
.brand .dot{width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 10px rgba(var(--glow),.6)}
.account{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line); background:transparent; color:var(--accent);
  display:flex;align-items:center;justify-content:center; cursor:pointer;
  box-shadow:0 0 10px rgba(var(--glow),.18);
}

/* ---------- search ---------- */
.searchbar{
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(160deg,var(--tile-1),var(--tile-2));
  border:1px solid var(--line);
  border-radius:999px; padding:6px 8px 6px 18px;
  box-shadow:0 0 16px rgba(var(--glow),.18), inset 0 0 14px rgba(var(--glow),.06);
}
.searchbar input{flex:1; border:0; outline:0; background:transparent; color:var(--text);
  font-size:17px; padding:12px 0; min-width:0}
.searchbar input::placeholder{color:var(--muted)}
.go{border:0; cursor:pointer; width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center; flex:none;
  box-shadow:0 0 14px rgba(var(--glow),.5)}
.go svg{stroke:#04121c}

/* ---------- engine chips ---------- */
.engines{display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:2px; scrollbar-width:none}
.engines::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--line); background:transparent; color:var(--muted);
  border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; white-space:nowrap}
.chip.on{color:#04121c; border-color:transparent; font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 12px rgba(var(--glow),.45)}

/* ---------- shortcut tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); margin-top:28px}
.tile{
  background:linear-gradient(160deg,var(--tile-1),var(--tile-2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 8px 12px; text-align:center; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:10px; overflow:hidden;
  box-shadow:0 0 12px rgba(var(--glow),.16), inset 0 0 16px rgba(var(--glow),.07);
}
.tile:active{box-shadow:0 0 20px rgba(var(--glow),.4), inset 0 0 18px rgba(var(--glow),.12)}
.tile .name{font-size:11.5px; color:var(--muted); max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* the icon holder — no box of its own; the tile carries the glow */
.badge{
  width:48px; height:48px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); font-weight:700; font-size:18px; line-height:0; position:relative;
}
.badge .fallback{display:flex; align-items:center; justify-content:center}
.badge img.fav{display:none; width:40px; height:40px; object-fit:contain}
.badge.hasimg img.fav{display:block}
.badge.hasimg .fallback{display:none}

.tile.add{border-style:dashed; opacity:.85}
.tile.add .badge{color:var(--muted)}

/* folder tile: a little stack behind the badge says "there is more inside" */
.tile.folder{position:relative}
.tile.folder::before,
.tile.folder::after{
  content:""; position:absolute; left:50%; transform:translateX(-50%);
  width:52px; height:40px; border-radius:14px;
  border:1px solid var(--line); opacity:.35;
}
.tile.folder::before{top:9px}
.tile.folder::after{top:13px; opacity:.6}
.tile.folder .badge{position:relative; z-index:2; margin-top:6px}

/* ---------- footer ---------- */
.foot{margin-top:34px; display:flex; gap:18px; justify-content:center; font-size:12.5px; color:var(--muted)}
.foot a{color:var(--muted); text-decoration:none; cursor:pointer}
.foot a:active{color:var(--accent)}

/* ---------- bottom sheets ---------- */
.sheet{position:fixed; inset:0; background:rgba(2,6,14,.72); display:none;
  align-items:flex-end; justify-content:center; z-index:50}
.sheet.open{display:flex}
.sheet .box{
  width:100%; max-width:var(--maxw);
  background:linear-gradient(180deg,var(--tile-1),var(--bg));
  border-radius:22px 22px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
  border-top:1px solid var(--line);
}
.sheet h3{margin:0 0 14px; font-size:15px; color:var(--accent)}
.sheet label{display:block; font-size:12px; color:var(--muted); margin:10px 0 5px}
.sheet input{width:100%; background:var(--tile-2); border:1px solid var(--line);
  border-radius:var(--radius-sm); color:var(--text); font-size:15px; padding:12px 14px; outline:0}
.sheet .row{display:flex; gap:10px; margin-top:18px}
.sheet button{flex:1; border-radius:var(--radius-sm); padding:13px; font-size:14.5px;
  cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--text)}
.sheet button.primary{border:0; color:#04121c;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); font-weight:600}

.dbg{margin-top:22px; font-size:10.5px; line-height:1.5; color:var(--muted);
  text-align:center; word-break:break-word; opacity:.85}
.cnt{color:var(--muted); font-size:12px; font-weight:400}
.hint{font-size:11.5px; color:var(--muted); margin:10px 0 2px}
.slist{max-height:34vh; overflow-y:auto; margin-bottom:6px}
.srow{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  margin-bottom:8px; background:var(--tile-2)}
.sname{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sx{flex:none; width:34px; height:34px; border-radius:50%; cursor:pointer;
  border:1px solid var(--line); background:transparent; color:var(--muted);
  font-size:19px; line-height:1}

/* ---------- folder contents grid ---------- */
.fgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.fapp{display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer;
  padding:10px 2px; border-radius:var(--radius-sm);
  background:linear-gradient(160deg,var(--tile-1),var(--tile-2)); border:1px solid var(--line)}
.fapp .badge{width:40px; height:40px}
.fapp .badge img.fav{width:32px; height:32px}
.fapp .name{font-size:11px; color:var(--muted); text-align:center; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><span class="dot"></span>PULSE&nbsp;HORIZON</div>
    <button class="account" id="accountBtn" aria-label="Google account">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
      </svg>
    </button>
  </div>

  <form class="searchbar" id="searchForm" autocomplete="off">
    <input id="q" type="text" inputmode="search" enterkeyhint="search"
           placeholder="Search or type a website" aria-label="Search">
    <button class="go" type="submit" aria-label="Go">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>
      </svg>
    </button>
  </form>

  <div class="engines" id="engines"></div>

  <div class="tiles" id="tiles"></div>

  <div class="dbg" id="dbg"></div>

  <div class="foot">
    <a id="termsLink">Terms</a>
    <a id="feedbackLink">Feedback</a>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <h3>Shortcuts <span class="cnt" id="sheetCount"></span></h3>
    <div class="slist" id="sheetList"></div>
    <div class="hint" id="sheetHint">Tap \u00d7 to remove a shortcut. You can keep 10.</div>
    <label for="tName">Name</label>
    <input id="tName" type="text" placeholder="e.g. Gmail" autocomplete="off">
    <label for="tUrl">Address</label>
    <input id="tUrl" type="text" placeholder="e.g. mail.google.com" autocomplete="off">
    <div class="row">
      <button id="sheetCancel">Close</button>
      <button id="sheetAdd" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="sheet" id="folder">
  <div class="box">
    <h3 id="folderTitle">Workspace</h3>
    <div class="fgrid" id="folderGrid"></div>
    <div class="row"><button id="folderClose">Close</button></div>
  </div>
</div>

<script>
/* ============================================================
   LOGIC — every feature. The design does not touch this.
   ============================================================ */

/* Dynamic bridge resolution: never cache a stale null on startup */
function getAndroid(){
  try{
    if(typeof AndroidHome !== 'undefined' && AndroidHome) return AndroidHome;
    if(window.AndroidHome) return window.AndroidHome;
  }catch(e){}
  return null;
}
var MAX_TILES = 10;

var PH_ICONS = {};
var PH_DEBUG = {};
function phDebug(m){ PH_DEBUG = m || {}; try{ renderDebug(); }catch(e){} }
function renderDebug(){
  var el = document.getElementById('dbg'); if(!el) return;
  var total = 0, ok = 0, bad = [];
  for(var host in PH_DEBUG){
    total++;
    var v = PH_DEBUG[host];
    if(v === 'app' || v === 'web' || v === 'cached') ok++;
    else bad.push(host + ' \u2192 ' + v);
  }
  if(total > 0){
    el.textContent = 'icons ' + ok + '/' + total + (bad.length ? '  \u00b7  ' + bad.join('  \u00b7  ') : '');
  } else {
    var count = (state && state.tiles) ? state.tiles.length : 0;
    el.textContent = 'icons: requested (' + count + ' shortcuts)';
  }
}
function phSetIcons(m){ PH_ICONS = m || {}; try{ renderTiles(); renderDebug(); }catch(e){} }
function phOneIcon(host, uri){ if(host && uri){ PH_ICONS[host] = uri; try{ renderTiles(); }catch(e){} } }

var ENGINES = [
  {id:'startpage', name:'Startpage', url:'https://www.startpage.com/sp/search?query='},
  {id:'google',    name:'Google',    url:'https://www.google.com/search?q='},
  {id:'bing',      name:'Bing',      url:'https://www.bing.com/search?q='},
  {id:'wiki',      name:'Wikipedia', url:'https://en.wikipedia.org/w/index.php?search='},
  {id:'ddg',       name:'DuckDuckGo',url:'https://duckduckgo.com/?q='},
  {id:'brave',     name:'Brave',     url:'https://search.brave.com/search?q='}
];

/* Original line-icons — drawn here, not anybody's artwork.
   Shown only until the real icon loads. */
var ICONS = {
  mail:   '<path d="M3 6.5h18v11H3z"/><path d="M3.6 7.2 12 13l8.4-5.8"/>',
  drive:  '<path d="M9.4 3.5h5.2l5.4 9.3-2.6 4.5H6.6L4 12.8z"/><path d="M9.4 3.5 12 8M14.6 3.5 12 8m0 0-5.4 9.3M12 8l5.4 9.3"/>',
  doc:    '<path d="M6.5 3h7l4.5 4.5V21h-11.5z"/><path d="M13.5 3v4.5H18M9 12h6M9 15.5h6M9 8.5h2.5"/>',
  sheet:  '<path d="M6.5 3h11v18h-11z"/><path d="M6.5 8.5h11M6.5 13.5h11M6.5 18h11M12 3v18"/>',
  slides: '<path d="M4 5h16v10.5H4z"/><path d="M12 15.5V20M8.5 20h7M8 8.5h8M8 11.5h5"/>',
  cal:    '<path d="M4 6.5h16V20H4z"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4M8 13.5h2M14 13.5h2M8 16.5h2M14 16.5h2"/>',
  meet:   '<path d="M3 7h11v10H3z"/><path d="M14 11.2 21 7v10l-7-4.2z"/>',
  photos: '<path d="M3.5 5h17v14h-17z"/><circle cx="8.6" cy="9.6" r="1.7"/><path d="M4 17.5 9.5 12l3.8 3.8 3-3 3.7 4.7"/>',
  pin:    '<path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 1 0-13 0C5.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/>',
  grid:   '<rect x="3.8" y="3.8" width="7.4" height="7.4" rx="2.2"/><rect x="12.8" y="3.8" width="7.4" height="7.4" rx="2.2"/><rect x="3.8" y="12.8" width="7.4" height="7.4" rx="2.2"/><rect x="12.8" y="12.8" width="7.4" height="7.4" rx="2.2"/>',
  play:   '<path d="M8.5 5.5 19 12 8.5 18.5z"/>',
  book:   '<path d="M4.5 5.2A2.7 2.7 0 0 1 7.2 2.5H19.5v16H7.2a2.7 2.7 0 0 0-2.7 2.7z"/><path d="M4.5 18.5h15M8.5 6.5h7M8.5 10h7"/>',
  globe:  '<circle cx="12" cy="12" r="8.7"/><path d="M3.3 12h17.4M12 3.3c2.9 3 2.9 14.4 0 17.4M12 3.3c-2.9 3-2.9 14.4 0 17.4"/>'
};

/* A tile is either a plain link  {name,url}
   or a folder  {name,folder:true,apps:[...]}  */
var WORKSPACE = {
  name:'Workspace', folder:true, icon:'grid',
  apps:[
    {name:'Gmail',    icon:'mail',   url:'https://mail.google.com'},
    {name:'Drive',    icon:'drive',  url:'https://drive.google.com'},
    {name:'Docs',     icon:'doc',    file:'docs.png',   url:'https://docs.google.com/document/u/0/'},
    {name:'Sheets',   icon:'sheet',  file:'sheets.png', url:'https://docs.google.com/spreadsheets/u/0/'},
    {name:'Slides',   icon:'slides', file:'slides.png', url:'https://docs.google.com/presentation/u/0/'},
    {name:'Calendar', icon:'cal',    url:'https://calendar.google.com'},
    {name:'Meet',     icon:'meet',   url:'https://meet.google.com'},
    {name:'Photos',   icon:'photos', url:'https://photos.google.com'}
  ]
};

/* The final design: a 3-wide grid of Google services. */
var DEFAULT_TILES = [
  {name:'Google',   icon:'globe',  url:'https://www.google.com'},
  {name:'Maps',     icon:'pin',    url:'https://maps.google.com'},
  {name:'Meet',     icon:'meet',   url:'https://meet.google.com'},
  {name:'Photos',   icon:'photos', url:'https://photos.google.com'},
  {name:'Gmail',    icon:'mail',   url:'https://mail.google.com'},
  {name:'Calendar', icon:'cal',    url:'https://calendar.google.com'},
  {name:'YouTube',  icon:'play',   url:'https://www.youtube.com'},
  {name:'Drive',    icon:'drive',  url:'https://drive.google.com'},
  /* Opens Google's own page. The waffle (9-dot) menu sits top-right and
     holds every Google app with Google's real, always-current icons —
     so nothing has to be drawn, fetched or maintained here.
     Note: the waffle appears when signed in to Google. */
  {name:'Google apps', icon:'grid', url:'https://www.google.com/'}
];

var KEY = 'ph_home_v6';
var state = {engine:'startpage', tiles:null};

function load(){
  var raw = '';
  var a = getAndroid();
  try{ if(a && a.getTiles) raw = a.getTiles() || ''; }catch(e){}
  if(!raw){ try{ raw = localStorage.getItem(KEY) || ''; }catch(e){} }
  try{
    if(raw){
      var s = JSON.parse(raw);
      if(s && s.engine) state.engine = s.engine;
      if(s && s.tiles && s.tiles.length) state.tiles = s.tiles;
    }
  }catch(e){}
  if(!state.tiles) state.tiles = JSON.parse(JSON.stringify(DEFAULT_TILES));
  if(state.tiles.length > MAX_TILES) state.tiles = state.tiles.slice(0, MAX_TILES);
}
function save(){
  var json = JSON.stringify(state);
  try{ localStorage.setItem(KEY, json); }catch(e){}
  var a = getAndroid();
  try{ if(a && a.setTiles) a.setTiles(json); }catch(e){}
}

function cleanHost(u){
  if(!u) return '';
  u = String(u).trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{
    return new URL(u).hostname.toLowerCase();
  }catch(e){
    var m = u.match(/^https?:\/\/([^\/:]+)/i);
    return m ? m[1].toLowerCase() : '';
  }
}

/* the hosts this page is showing - the app asks for these */
function phHosts(){
  var hosts = [];
  function add(u){
    var host = cleanHost(u);
    if(host && hosts.indexOf(host) < 0) hosts.push(host);
  }
  (state.tiles || []).forEach(function(t){
    if(t.folder){ (t.apps||[]).forEach(function(a){ if(a.url) add(a.url); }); }
    else if(t.url) add(t.url);
  });
  return JSON.stringify(hosts);
}
function askIcons(){
  var hostsJson = phHosts();
  // 1. Dynamic Java bridge call
  var a = getAndroid();
  if(a && a.wantIcons){
    try{ a.wantIcons(hostsJson); }catch(e){}
  }
  // 2. Guaranteed fallback channel via document.title
  try{
    document.title = 'PH_HOSTS:' + hostsJson;
  }catch(e){}
}
function engineById(id){
  for(var i=0;i<ENGINES.length;i++) if(ENGINES[i].id===id) return ENGINES[i];
  return ENGINES[0];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function iconSvg(kind){
  var d = ICONS[kind];
  if(!d) return null;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '+
         'stroke-linecap="round" stroke-linejoin="round" width="26" height="26">'+ d +'</svg>';
}
function initialHtml(item){
  return '<span style="font-weight:700;font-size:18px">'+
    (item.name ? item.name.charAt(0).toUpperCase() : '?') +'</span>';
}

/* ---- REAL ICONS -------------------------------------------------
   1. BUNDLED ICONS — the exact 100% route. Drop a PNG into
      app/src/main/assets/icons/  named after the site, e.g.
      mail.google.com.png — it wins instantly: real, permanent,
      offline. Those files are yours to supply; I don't source them.
   2. Then the site's own /favicon.ico (free, no third party).
   3. Then favicon services — for Google's product pages, whose own
      icon bounces to a sign-in page, the service is tried first.
   Set USE_FAVICONS = false for drawn icons only, fully offline.  */
var USE_FAVICONS = true;

function faviconUrls(site, file){
  var out = [];
  try{
    var u = new URL(site), host = u.hostname;
    var local = [];
    /* 0. REAL LAUNCHER ICONS — handed over by the app itself, read from the
       Google apps installed on this device. Real, permanent, offline. */
    if(PH_ICONS[host]) local.push(PH_ICONS[host]);
    if(file) local.push('icons/' + file);
    local.push('icons/' + host + '.png');
    local.push('icons/' + host + '.webp');

    var svc = [
      'https://www.google.com/s2/favicons?sz=64&domain=' + host,
      'https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://' + host + '&size=64',
      'https://icons.duckduckgo.com/ip3/' + host + '.ico'
    ];
    var own = [ u.origin + '/favicon.ico', u.origin + '/apple-touch-icon.png' ];
    var isGoogle = /(^|\.)google\.com$/.test(host) || /(^|\.)googleusercontent\.com$/.test(host);

    out = local.concat(isGoogle ? svc.concat(own) : own.concat(svc));
  }catch(e){}
  return out;
}
function phFavErr(img){
  var rest = (img.getAttribute('data-rest') || '').split('|').filter(Boolean);
  if(rest.length){
    img.setAttribute('data-rest', rest.slice(1).join('|'));
    img.src = rest[0];
  }
  /* else: every source failed — the drawn icon is already showing behind it */
}

function badgeHtml(item){
  var fallback = iconSvg(item.icon) || initialHtml(item);
  var urls = (USE_FAVICONS && item.url) ? faviconUrls(item.url, item.file) : [];
  if(urls.length){
    return '<span class="badge">'+
      '<img class="fav" src="'+ urls[0] +'" alt="" data-rest="'+ urls.slice(1).join('|') +'" '+
        'onload="this.parentNode.classList.add(\'hasimg\')" '+
        'onerror="phFavErr(this)">'+
      '<span class="fallback">'+ fallback +'</span>'+
    '</span>';
  }
  return '<span class="badge">'+ fallback +'</span>';
}

/* ---- render engine chips ---- */
function renderEngines(){
  var box = document.getElementById('engines');
  box.innerHTML = '';
  ENGINES.forEach(function(e){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (e.id===state.engine ? ' on' : '');
    b.textContent = e.name;
    b.onclick = function(){ state.engine = e.id; save(); renderEngines(); };
    box.appendChild(b);
  });
}

/* ---- render tiles ---- */
function renderTiles(){
  var box = document.getElementById('tiles');
  box.innerHTML = '';
  state.tiles.forEach(function(t, idx){
    var d = document.createElement('div');
    d.className = 'tile' + (t.folder ? ' folder' : '');
    d.innerHTML = badgeHtml(t) + '<span class="name">'+ escapeHtml(t.name) +'</span>';

    var pressTimer = null;
    function startPress(){ pressTimer = setTimeout(function(){ pressTimer=null; removeTile(idx); }, 650); }
    function endPress(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }
    d.addEventListener('touchstart', startPress);
    d.addEventListener('touchend', endPress);
    d.addEventListener('touchmove', endPress);
    d.addEventListener('mousedown', startPress);
    d.addEventListener('mouseup', endPress);

    d.onclick = function(){
      endPress();
      if(t.folder) openFolder(idx); else go(t.url);
    };
    box.appendChild(d);
  });

  var add = document.createElement('div');
  add.className = 'tile add';
  add.innerHTML = '<span class="badge">+</span><span class="name">Add</span>';
  add.onclick = openSheet;
  box.appendChild(add);
}

function removeTile(idx){
  if(idx < 0 || idx >= state.tiles.length) return;
  state.tiles.splice(idx,1); save(); renderTiles();
}

/* ---- navigation ---- */
function go(url){
  if(!url) return;
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  window.location.href = url;
}
function looksLikeUrl(s){
  if(/\s/.test(s)) return false;
  return /^https?:\/\//i.test(s) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s);
}
function submitQuery(){
  var raw = document.getElementById('q').value.trim();
  if(!raw) return;
  if(looksLikeUrl(raw)){ go(raw); return; }
  go(engineById(state.engine).url + encodeURIComponent(raw));
}

/* ---- folder ("expand") ---- */
var folderSheet = document.getElementById('folder');
function openFolder(idx){
  var t = state.tiles[idx];
  if(!t || !t.folder) return;
  document.getElementById('folderTitle').textContent = t.name;
  var grid = document.getElementById('folderGrid');
  grid.innerHTML = '';
  (t.apps || []).forEach(function(a){
    var el = document.createElement('div');
    el.className = 'fapp';
    el.innerHTML = badgeHtml(a) + '<span class="name">'+ escapeHtml(a.name) +'</span>';
    el.onclick = function(){ closeFolder(); go(a.url); };
    grid.appendChild(el);
  });
  folderSheet.classList.add('open');
}
function closeFolder(){ folderSheet.classList.remove('open'); }

/* ---- add-shortcut sheet ---- */
var sheet = document.getElementById('sheet');
function openSheet(){
  document.getElementById('tName').value = '';
  document.getElementById('tUrl').value = '';
  setHint('Tap \u00d7 to remove a shortcut. You can keep ' + MAX_TILES + '.');
  renderSheetList();
  sheet.classList.add('open');
  document.getElementById('tName').focus();
}
function closeSheet(){ sheet.classList.remove('open'); }
function addTile(){
  var n = document.getElementById('tName').value.trim();
  var u = document.getElementById('tUrl').value.trim();
  if(!n || !u) return;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  if(state.tiles.length >= MAX_TILES){ setHint('You can keep ' + MAX_TILES + ' shortcuts. Remove one first.'); return; }
  state.tiles.push({name:n, url:u, icon:'globe'});
  document.getElementById('tName').value = '';
  document.getElementById('tUrl').value = '';
  save(); renderTiles(); askIcons(); renderSheetList();
}
function setHint(t){ var el=document.getElementById('sheetHint'); if(el) el.textContent = t; }

function renderSheetList(){
  var box = document.getElementById('sheetList');
  if(!box) return;
  box.innerHTML = '';
  state.tiles.forEach(function(t, idx){
    var row = document.createElement('div');
    row.className = 'srow';
    row.innerHTML = '<span class="sname">'+ escapeHtml(t.name) +'</span>';
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'sx'; x.textContent = '\u00d7';
    x.setAttribute('aria-label', 'Remove ' + t.name);
    x.onclick = function(){ state.tiles.splice(idx,1); save(); renderTiles(); renderSheetList(); askIcons(); };
    row.appendChild(x);
    box.appendChild(row);
  });
  var c = document.getElementById('sheetCount');
  if(c) c.textContent = state.tiles.length + ' / ' + MAX_TILES;
}

/* ---- wire it up ---- */
document.getElementById('searchForm').addEventListener('submit', function(ev){
  ev.preventDefault(); submitQuery();
});
document.getElementById('accountBtn').onclick = function(){ go('https://accounts.google.com/'); };
document.getElementById('sheetCancel').onclick = closeSheet;
document.getElementById('sheetAdd').onclick = addTile;
sheet.addEventListener('click', function(ev){ if(ev.target === sheet) closeSheet(); });
document.getElementById('folderClose').onclick = closeFolder;
folderSheet.addEventListener('click', function(ev){ if(ev.target === folderSheet) closeFolder(); });
document.getElementById('termsLink').onclick = function(){ go('terms.html'); };
document.getElementById('feedbackLink').onclick = function(){ go('feedback.html'); };

/* Expose functions on window for evaluateJavascript and bridge */
window.phHosts = phHosts;
window.phSetIcons = phSetIcons;
window.phDebug = phDebug;
window.phOneIcon = phOneIcon;
window.askIcons = askIcons;

/* ---- boot ---- */
load();
renderEngines();
renderTiles();
renderDebug();
askIcons();
document.getElementById('q').focus();
</script>
</body>
</html>
